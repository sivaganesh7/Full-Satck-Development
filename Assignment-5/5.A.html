<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Color References</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin: 20px;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
        }
        .color-box {
            width: 80%;
            margin: 10px auto;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            text-align: left;
        }
        .red { background-color: red; }
        .hex { background-color: #1E90FF; } /* Dodger Blue */
        .rgb { background-color: rgb(34, 139, 34); } /* Forest Green */
        .rgba { background-color: rgba(255, 99, 71, 0.7); color: black; } /* Tomato with opacity */
        .hsl { background-color: hsl(240, 100%, 50%); } /* Blue */
        .hsla { background-color: hsla(120, 60%, 70%, 0.6); color: black; } /* Light Green with opacity */
    </style>
</head>
<body>

    <h1>CSS Color References</h1>

    <div class="color-box red">Color Name: Red</div>
    <div class="color-box hex">HEX Value: #1E90FF</div>
    <div class="color-box rgb">RGB Value: rgb(34, 139, 34)</div>
    <div class="color-box rgba">RGBA Value: rgba(255, 99, 71, 0.7)</div>
    <div class="color-box hsl">HSL Value: hsl(240, 100%, 50%)</div>
    <div class="color-box hsla">HSLA Value: hsla(120, 60%, 70%, 0.6)</div>

</body>
</html>
