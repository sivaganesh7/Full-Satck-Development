<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Font and Text Properties</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
        }

        .font-size {
            font-size: 24px;
        }

        .font-weight {
            font-weight: bold;
        }

        .font-style {
            font-style: italic;
        }

        .text-decoration {
            text-decoration: underline;
        }

        .text-transform {
            text-transform: uppercase;
            font-weight: bold;
        }

        .text-align {
            text-align: center;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>CSS Font and Text Properties Demonstration</h1>

    <p class="font-size">This text demonstrates <strong>font-size</strong>.</p>
    <p class="font-weight">This text demonstrates <strong>font-weight</strong>.</p>
    <p class="font-style">This text demonstrates <em>font-style</em>.</p>
    <p class="text-decoration">This text demonstrates <u>text-decoration</u>.</p>
    <p class="text-transform">This text demonstrates <strong>TEXT-TRANSFORMATION</strong>.</p>

    <div class="text-align">
        This text demonstrates <strong>text-alignment</strong>.
    </div>

</body>
</html>
